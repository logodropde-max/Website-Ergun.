/* Gooey: Punkt tropft aus „online“ heraus, sobald das letzte Wort steht */
.ac-hero[data-nb="1"] .ac-word .ac-rdot-w{transform-origin:0 50%}
.ac-hero[data-nb="1"][data-nb-p="1"] .ac-word .ac-rdot-w{animation:gooTropfen .9s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes gooTropfen{0%{transform:translateX(-.35em) scale(.25,.6)!important;filter:blur(6px)}55%{transform:translateX(.05em) scale(1.15,.9)!important;filter:blur(1px)}100%{transform:none!important;filter:blur(0)}}
/* Fire Sphere als sichtbarer Punkt (feuerpunkt.js) */
.fp-box{position:fixed;left:0;top:0;z-index:55;pointer-events:none;opacity:0;will-change:transform,width,height}
.fp-cv{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.fp-glow{position:absolute;inset:-18%;width:136%;height:136%;filter:blur(22px) brightness(1.6) saturate(1.3);transform:scale(.74)}
.fp-ohne .fp-cv{background:radial-gradient(circle at 45% 40%,#fff1c9 0,#ffb347 40%,#e8591a 100%)}
/* der echte Punkt und der wachsende Ball werden von der Feuerkugel übernommen */
body .ac-hero .ac-word .ac-rdot-w{background:transparent!important;box-shadow:none!important}
body.fp-gross .gf-ball,.gf-ball{background:transparent!important;box-shadow:none!important}
.mg-stage{background:#fff!important}
/* Gelbes Licht statt Feuerkugel (licht-punkt.js) */
.lp-box{position:fixed;left:0;top:0;z-index:55;pointer-events:none;opacity:0;border-radius:50%;will-change:transform,width,height;
  background:radial-gradient(circle,#fffdf2 0,#fff3b8 calc(var(--lp-kern,14%) * .6),#ffd84a var(--lp-kern,14%),rgba(255,200,40,.55) calc(var(--lp-kern,14%) + 10%),rgba(255,190,40,.18) 46%,rgba(255,190,40,0) 70%);mix-blend-mode:multiply}
@media (max-width:520px){.intro-berg .ac-hero .ac-words .ac-word{font-size:clamp(24px,8.2vw,42px)!important}}
/* Punkt-Story (licht-punkt.js) */
.lp-cv{position:fixed;inset:0;width:100vw;height:100vh;z-index:55;pointer-events:none}
.lp-box{display:none!important}
/* erstes Wort erst, wenn „100 %“ weg ist */
body:not(.lp-w) .ac-hero .ac-words .ac-word{opacity:0!important}
.ac-hero .ac-words .ac-word:first-child{transition:opacity .45s ease}
/* Abstand zwischen „online“ und dem Punkt (der Zoom startet genau dort) */
.ac-hero .ac-word .ac-rdot-w{margin-left:.3em!important}
/* Variante A: Satzpunkt der Wörter ist der gelbe Punkt */
.lp-satz{color:transparent!important;-webkit-text-fill-color:transparent!important}
.mg-stage{background:#fff!important}
</style>
