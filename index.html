<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERGUN. | Websites für jeden, der eine braucht</title>
<meta name="description" content="Sie brauchen eine Website? Wir machen das. Persönlich geplant und betreut, mit kostenlosem Erstgespräch, wo Sie wollen.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow"><!-- solange die Seite privat ist; beim offiziellen Start entfernen -->
<meta property="og:type" content="website">
<meta property="og:title" content="ERGUN. | Websites für jeden, der eine braucht">
<meta property="og:description" content="Sie brauchen eine Website? Wir machen das. Kostenloses Erstgespräch, wo Sie wollen.">
<meta property="og:locale" content="de_DE">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
<style>
html,body{margin:0;background:#fff}
.intro-berg .ac-head,.intro-berg .ac-crop,.intro-berg .ac-origins,.intro-berg .ac-bean,.intro-berg .ac-strip,.intro-berg .ac-stick,.intro-berg .ac-limited,.intro-berg .ac-foot{display:none!important}
.anf{position:fixed;inset:0;z-index:1000;background:rgba(14,18,10,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;overflow:auto;font-family:"Inter Display",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;animation:anfIn .25s ease}
@keyframes anfIn{from{opacity:0}}
.anf-box{position:relative;width:min(560px,100%);background:#fbf8f1;color:#151a10;border-radius:22px;padding:30px 26px 24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.anf-zu{position:absolute;top:12px;right:14px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:#555;padding:6px}
.anf-k{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a0742f}
.anf-box h2{margin:8px 0 6px;font:500 clamp(24px,4vw,32px)/1.1 "Libre Caslon Display","Playfair Display",Didot,"Times New Roman",serif;letter-spacing:-.02em}
.anf-t{margin:0 0 18px;color:#555;font-size:15px;line-height:1.45}
.anf form{display:grid;gap:12px}
.anf label{display:grid;gap:5px;font-size:13.5px;color:#333}
.anf input:not([type=checkbox]),.anf select,.anf textarea{font:inherit;font-size:15px;padding:11px 12px;border-radius:10px;border:1px solid #d9d2c2;background:#fff;color:#151a10}
.anf input:focus,.anf select:focus,.anf textarea:focus{outline:2px solid #c99b55;outline-offset:1px}
.anf-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.anf-2{grid-template-columns:1fr}}
.anf-wahl{display:flex;gap:8px}
.anf-wahl button{flex:1;color:#151a10;padding:10px;border-radius:999px;border:1px solid #d9d2c2;background:#fff;font:inherit;font-size:14px;cursor:pointer}
.anf-wahl button[aria-pressed=true]{background:#151a10;color:#fff;border-color:#151a10}
.anf-c{display:flex!important;grid-template-columns:none;align-items:flex-start;gap:8px!important;font-size:13px!important;line-height:1.4}
.anf-c input{margin-top:2px;flex:none}.anf-c span{flex:1}
.anf-c a{color:inherit}
.anf-f{margin:0;color:#b4412b;font-size:14px}
.anf-los{margin-top:4px;padding:14px;border-radius:999px;border:0;background:#151a10;color:#fff;font:inherit;font-size:16px;cursor:pointer}
.anf-los:hover{background:#2a3320}
.anf-h{margin:0;font-size:12.5px;color:#777;text-align:center}
.intro-glas{position:fixed;inset:0;z-index:2000;background:#eef2f8;transition:opacity .7s ease,filter .7s ease}
.intro-glas.weg{opacity:0;filter:blur(10px);pointer-events:none}
.intro-wort{position:absolute;left:0;right:0;bottom:12vh;margin:0;text-align:center;font:600 13px/1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:.5em;color:#0f141c;opacity:0;animation:introWort 1s ease 1.6s forwards}
@keyframes introWort{to{opacity:.7}}
.intro-skip{position:absolute;right:20px;bottom:20px;border:0;background:rgba(15,20,28,.08);color:#0f141c;font:500 13px system-ui,sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer}
.lets-ergun{font-family:HjSans,"Inter Tight",Inter,system-ui,sans-serif!important;--foreground:#0f141c;--background:#ffffff;--border:rgba(15,20,28,.16);--muted-foreground:#6b7280;background:#fff;color:#0f141c;font-family:"Inter Tight",Inter,system-ui,sans-serif}
</style>
<link rel="stylesheet" href="tw.css?v=1">
</head>
<body>
<div id="root"></div>
<script src="ergun-berg.js?v=2"></script>
</body>
</html>
